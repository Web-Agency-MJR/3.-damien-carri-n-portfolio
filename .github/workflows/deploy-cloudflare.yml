# Despliega la web en la cuenta de Cloudflare de Damien (Damiencarrion13@gmail.com's Account)
# en cada cambio de la rama main (incluidos los que llegan desde Lovable).
#
# Requisito único: el secreto del repositorio CLOUDFLARE_API_TOKEN, con un token de esa
# cuenta creado con la plantilla «Edit Cloudflare Workers». Mientras no exista, el
# workflow termina sin desplegar y sin marcar error.
name: Desplegar en Cloudflare (cuenta de Damien)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9eaa4c9a20c3daad984ffeaa5d71985b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: damien-carrion
    steps:
      - name: Comprobar que existe el token de Cloudflare
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN. No se despliega."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.ready == 'true'

      - name: Instalar dependencias
        if: steps.token.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Compilar
        if: steps.token.outputs.ready == 'true'
        run: bun run build

      - name: Desplegar en Cloudflare Workers
        if: steps.token.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy --name "$WORKER_NAME"
